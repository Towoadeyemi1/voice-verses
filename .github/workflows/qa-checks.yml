name: QA Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: "CHECK 1: Type check"
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: "CHECK 2: Web and desktop builds"
        run: |
          VITE_BASE_PATH=/voice-verses/ npm run build
          test -f dist/sw.js || { echo "❌ FAIL: web build has no service worker"; exit 1; }
          grep -q 'src="/voice-verses/assets/' dist/index.html || { echo "❌ FAIL: web build ignores VITE_BASE_PATH"; exit 1; }

          rm -rf dist
          ELECTRON_BUILD=true npx vite build
          grep -q 'src="./assets/' dist/index.html || { echo "❌ FAIL: desktop build must use relative ./ asset paths"; exit 1; }
          test ! -f dist/sw.js || { echo "❌ FAIL: desktop build must not register a service worker"; exit 1; }
          for f in electron/*.js electron/*.cjs electron/speech/*; do node --check "$f"; done
          echo "✅ Web and desktop builds OK"

      - name: "CHECK 3: Electron build scripts include ELECTRON_BUILD=true"
        run: |
          if grep -q "cross-env ELECTRON_BUILD=true" package.json; then
            echo "✅ electron:build scripts include ELECTRON_BUILD=true"
          else
            echo "❌ FAIL: electron build scripts missing cross-env ELECTRON_BUILD=true"
            exit 1
          fi

      - name: "CHECK 4: cross-env in devDependencies"
        run: |
          if grep -q '"cross-env"' package.json; then
            echo "✅ cross-env present in package.json"
          else
            echo "❌ FAIL: cross-env missing from devDependencies"
            exit 1
          fi

      - name: "CHECK 5: Electron main.js uses loadFile in production"
        run: |
          if grep -q "loadFile" electron/main.js; then
            echo "✅ electron/main.js uses loadFile for production"
          else
            echo "❌ FAIL: electron/main.js does not use loadFile — app won't load over file://"
            exit 1
          fi

      - name: "CHECK 6: Release workflow can publish releases"
        run: |
          if grep -q "contents: write" .github/workflows/build-electron.yml; then
            echo "✅ release job has contents:write permission"
          else
            echo "❌ FAIL: release job missing 'contents: write' — releases will fail with 403"
            exit 1
          fi

      - name: "CHECK 7: Download links match installer file names"
        run: |
          node -e "
            const build = require('./package.json').build;
            const links = require('fs').readFileSync('src/lib/releases.ts', 'utf8');
            const expected = [
              build.mac.artifactName.replace('\${arch}', 'arm64').replace('\${ext}', 'dmg'),
              build.mac.artifactName.replace('\${arch}', 'x64').replace('\${ext}', 'dmg'),
              build.nsis.artifactName.replace('\${arch}', 'x64').replace('\${ext}', 'exe'),
            ];
            const missing = expected.filter((name) => !links.includes(name));
            if (missing.length) { console.error('❌ FAIL: src/lib/releases.ts lacks', missing); process.exit(1); }
            console.log('✅ Download links match installer names:', expected.join(', '));
          "

      - name: "CHECK 8: Speech engine and detector"
        run: |
          npx esbuild tools/speech-eval/detector-check.ts --bundle --platform=node --alias:@=./src --outfile=/tmp/detector-check.cjs --log-level=error
          node /tmp/detector-check.cjs

      - name: QA Summary
        if: success()
        run: |
          echo ""
          echo "================================"
          echo "  ✅ ALL QA CHECKS PASSED"
          echo "  Voice Verses is release-ready"
          echo "================================"
