name: QA Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "CHECK 1: Vite base path uses ./ for electron builds"
        run: |
          if grep -q "isElectronBuild ? './' :" vite.config.ts; then
            echo "✅ Vite base path: relative ./ set for electron builds"
          else
            echo "❌ FAIL: vite.config.ts does not set base to './' for electron builds"
            exit 1
          fi

      - name: "CHECK 2: PWA disabled for electron builds"
        run: |
          if grep -q "!isElectronBuild && VitePWA" vite.config.ts; then
            echo "✅ PWA disabled for electron builds"
          else
            echo "❌ FAIL: PWA plugin is not disabled for electron builds — will cause blank screen"
            exit 1
          fi

      - name: "CHECK 3: Electron build scripts include ELECTRON_BUILD=true"
        run: |
          if grep -q "cross-env ELECTRON_BUILD=true" package.json; then
            echo "✅ electron:build scripts include ELECTRON_BUILD=true"
          else
            echo "❌ FAIL: electron build scripts missing cross-env ELECTRON_BUILD=true"
            exit 1
          fi

      - name: "CHECK 4: cross-env in devDependencies"
        run: |
          if grep -q '"cross-env"' package.json; then
            echo "✅ cross-env present in package.json"
          else
            echo "❌ FAIL: cross-env missing from devDependencies"
            exit 1
          fi

      - name: "CHECK 5: Electron main.js uses loadFile in production"
        run: |
          if grep -q "loadFile" electron/main.js; then
            echo "✅ electron/main.js uses loadFile for production"
          else
            echo "❌ FAIL: electron/main.js does not use loadFile — app won't load over file://"
            exit 1
          fi

      - name: "CHECK 6: Release workflow has contents:write permission"
        run: |
          if grep -q "contents: write" .github/workflows/build-electron.yml; then
            echo "✅ release job has contents:write permission"
          else
            echo "❌ FAIL: release job missing 'contents: write' — releases will fail with 403"
            exit 1
          fi

      - name: "CHECK 7: Release workflow publishes to cornerstone-speech-releases"
        run: |
          if grep -q "cornerstone-speech-releases" .github/workflows/build-electron.yml; then
            echo "✅ workflow publishes to cornerstone-speech-releases"
          else
            echo "❌ FAIL: workflow does not publish to cornerstone-speech-releases"
            exit 1
          fi

      - name: "CHECK 8: Download links point to cornerstone-speech-releases"
        run: |
          if grep -q "cornerstone-speech-releases" src/components/SettingsPanel.tsx; then
            echo "✅ Download links point to cornerstone-speech-releases"
          else
            echo "❌ FAIL: Download links do not point to cornerstone-speech-releases"
            exit 1
          fi

      - name: "CHECK 9: Download filenames use dots (Voice.Verses format)"
        run: |
          if grep -q "Voice.Verses-1.0.0-arm64.dmg" src/components/SettingsPanel.tsx && \
             grep -q "Voice.Verses.Setup.1.0.0.exe" src/components/SettingsPanel.tsx; then
            echo "✅ Download filenames match electron-builder output format"
          else
            echo "❌ FAIL: Download filenames don't match electron-builder output (should use dots: Voice.Verses-...)"
            exit 1
          fi

      - name: "CHECK 10: Verify live release exists in cornerstone-speech-releases"
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          RELEASE=$(gh release view --repo Towoadeyemi1/cornerstone-speech-releases --json tagName,assets 2>/dev/null || echo "NOT_FOUND")
          if echo "$RELEASE" | grep -q "NOT_FOUND"; then
            echo "❌ FAIL: No release found in cornerstone-speech-releases"
            exit 1
          fi
          if echo "$RELEASE" | grep -q ".dmg" && echo "$RELEASE" | grep -q ".exe"; then
            echo "✅ Live release exists with .dmg and .exe assets"
            echo "$RELEASE" | grep -o '"name":"[^"]*"' | head -5
          else
            echo "❌ FAIL: Latest release is missing .dmg or .exe assets"
            exit 1
          fi

      - name: QA Summary
        if: success()
        run: |
          echo ""
          echo "================================"
          echo "  ✅ ALL QA CHECKS PASSED"
          echo "  Voice Verses is release-ready"
          echo "================================"
