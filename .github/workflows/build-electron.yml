name: Build desktop installers

# Push a tag like v1.2.0 to build signed (when secrets are set) installers for
# macOS (Apple chip + Intel) and Windows and publish them as a GitHub Release.
# Installed apps update themselves from these releases.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add the speech engine for both Mac architectures
        if: runner.os == 'macOS'
        # npm only installs the native package for the runner's own CPU
        run: npm install --no-save --force sherpa-onnx-darwin-x64@2.0.0 sherpa-onnx-darwin-arm64@2.0.0

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: resources/models
          key: speech-models-${{ hashFiles('scripts/fetch-models.mjs') }}

      - name: Download speech models
        run: node scripts/fetch-models.mjs

      - name: Build app
        shell: bash
        run: npx cross-env ELECTRON_BUILD=true vite build

      - name: Build installers
        shell: bash
        env:
          # Optional code signing. Without these, installers are unsigned
          # (macOS: ad-hoc signed) and show a warning on first launch.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12_BASE64 || secrets.WIN_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
              extra+=(-c.mac.notarize=true)
              # Lets the app install its own updates (see electron/updates.js)
              echo '{"signed": true}' > electron/build-info.json
            else
              unset CSC_LINK CSC_KEY_PASSWORD
              extra+=(-c.mac.identity=-)
            fi
          elif [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx electron-builder ${{ matrix.platform }} --publish never "${extra[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
